<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>webcatcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕸️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'DM Sans',sans-serif;background:#fafafa;color:#1a1a1a;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
header{background:#111;color:#f0f0f0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:baseline;gap:10px}
header h1{font:700 30px 'Caveat',cursive;margin:0}header small{color:#888;font-size:12px;flex:1}
header em{font:600 15px 'Caveat',cursive;color:#aac756;font-style:normal}
main{flex:1;overflow-y:auto;padding:12px 12px 8px}
textarea{width:100%;height:84px;border:1px solid #e0e0e0;border-radius:12px;padding:10px;font:13px/1.4 'DM Sans',sans-serif;resize:vertical;background:#fff}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
button{font:600 13px 'DM Sans',sans-serif;border:1px solid #e0e0e0;background:#fff;border-radius:10px;padding:9px 12px;color:#1a1a1a}
button.go{background:#2e7d52;border-color:#2e7d52;color:#fff;flex:1}button:active{opacity:.7}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:999px;padding:6px 11px;font-size:12px;background:#fff}
.chip.on{background:#111;color:#fff;border-color:#111}.chip b{opacity:.6;margin-left:4px;font-weight:500}
.lbl{font:700 17px 'Caveat',cursive;color:#555;margin:6px 0 0}
details{background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin:8px 0;overflow:hidden}
summary{padding:10px 12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
summary i{font-style:normal;font-size:12px;color:#888;font-weight:500}
.err{color:#e53935;font-size:12px;padding:0 12px 10px}
.lk{display:flex;gap:9px;padding:8px 12px;border-top:1px solid #f0f0f0;align-items:flex-start}
.lk input{margin-top:3px;width:18px;height:18px;accent-color:#2e7d52;flex:none}
.lk div{min-width:0;flex:1}.lk p{margin:0;font-size:13px;overflow-wrap:anywhere}.lk small{display:block;color:#999;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{font-size:10px;font-weight:600;border-radius:6px;padding:2px 6px;margin-right:4px}
.bh{background:#fff1e6;color:#ff6600}.bt{background:#e8f0ff;color:#3b7ae0}
footer{background:#111;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center}
footer button{background:#222;border-color:#333;color:#f0f0f0;padding:9px 10px}footer .go{background:#2e7d52;border-color:#2e7d52;flex:1}
footer span{font:600 14px 'Caveat',cursive;color:#666;padding-left:2px}
.empty{text-align:center;color:#999;font-size:13px;padding:28px 10px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style></head><body>
<div class="app">
<header><h1>🕸️ webcatcher</h1><small id="stat">listo</small><em>angstapp</em></header>
<main>
<textarea id="inp" placeholder="Pega aquí URLs de páginas, una por línea…" autocomplete="off"></textarea>
<div class="row"><button id="paste">📋 Pegar</button><button id="clear">🗑️</button><button class="go" id="go">🔍 Capturar</button></div>
<div id="out"><div class="empty">🕸️ Pega una o varias páginas y toca Capturar.<br>Verás sus enlaces filtrados por hoster y tipo.</div></div>
</main>
<footer><button id="vis">✔ visibles</button><button id="none">✖</button><span id="cnt"></span><button class="go" id="copy">📋 Copiar</button><button id="dl">⬇️ .txt</button></footer>
</div>
<div id="toast"></div>
<script>
const API='https://webcatcher.angst-66394c52.workers.dev/extract';
const HOSTERS={'mega.nz':'MEGA','mediafire.com':'MediaFire','drive.google.com':'Google Drive','dropbox.com':'Dropbox','1drv.ms':'OneDrive','archive.org':'Archive.org','wetransfer.com':'WeTransfer'};
const TYPES={'📦 Comprimidos':'zip rar 7z tar gz tgz bz2 xz','🎬 Video':'mp4 mkv avi mov webm m4v','🎵 Audio':'mp3 flac wav m4a ogg opus aac','🖼️ Imágenes':'jpg jpeg png gif webp svg bmp','📄 Documentos':'pdf epub mobi doc docx xls xlsx ppt pptx txt md csv','💿 Instaladores':'exe msi apk dmg deb rpm iso appimage'};
const UNK='❔ Desconocido',EXT={};for(const[k,v]of Object.entries(TYPES))v.split(' ').forEach(e=>EXT[e]=k);
const ERR={invalid_url:'URL inválida',blocked:'Bloqueada (dirección interna)',timeout:'La página tardó demasiado',not_html:'No es una página HTML',too_large:'Página demasiado grande',fetch_failed:'No se pudo leer la página',rate_limited:'Demasiadas solicitudes, espera un minuto',forbidden_origin:'Origen no permitido',net:'Sin conexión con el Worker'};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let groups=[],fh=new Set(),ft=new Set();
const hosterOf=h=>{for(const d in HOSTERS)if(h===d||h.endsWith('.'+d))return HOSTERS[d];return h};
const typeOf=e=>EXT[e]||UNK;
const urlsIn=t=>[...new Set((t.match(/https?:\/\/[^\s"'<>]+/g)||[]).map(u=>u.replace(/[.,;)]+$/,'')))];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
const vis=l=>(!fh.size||fh.has(l.h))&&(!ft.size||ft.has(l.t));
const all=()=>groups.flatMap(g=>g.links);
function render(){
  const L=all(),ch=(map,set,key)=>Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="chip ${set.has(k)?'on':''}" data-k="${key}" data-v="${esc(k)}">${esc(k)}<b>${n}</b></button>`).join('');
  const cnt=k=>L.reduce((m,l)=>(m[l[k]]=(m[l[k]]||0)+1,m),{});
  let h='';
  if(L.length)h+=`<div class="lbl">hoster</div><div class="chips">${ch(cnt('h'),fh,'h')}</div><div class="lbl">tipo</div><div class="chips">${ch(cnt('t'),ft,'t')}</div>`;
  groups.forEach((g,gi)=>{
    const v=g.links.filter(vis),host=(()=>{try{return new URL(g.url).hostname.replace(/^www\./,'')}catch{return g.url}})();
    h+=`<details open><summary>${g.st==='wait'?'⏳':g.st==='err'?'⚠️':'✅'}<span>${esc(host)}</span><i>${g.st==='ok'?v.length+'/'+g.links.length:''}</i></summary>`;
    if(g.st==='err')h+=`<div class="err">${esc(ERR[g.error]||g.error)}</div>`;
    if(g.st==='ok'&&!v.length)h+=`<div class="err" style="color:#999">${g.links.length?'Ningún enlace pasa los filtros':'Sin enlaces en esta página'}</div>`;
    g.links.forEach((l,li)=>{if(!vis(l))return;h+=`<label class="lk"><input type="checkbox" data-g="${gi}" data-i="${li}" ${l.sel?'checked':''}><div><p>${esc(l.text||decodeURIComponent(l.href.split('/').pop().split('?')[0]||l.host).slice(0,90))}</p><small>${esc(l.href)}</small><span class="bd bh">${esc(l.h)}</span>${l.ext?`<span class="bd bt">.${esc(l.ext)}</span>`:''}</div></label>`});
    h+='</details>';
  });
  if(!groups.length)h='<div class="empty">🕸️ Pega una o varias páginas y toca Capturar.<br>Verás sus enlaces filtrados por hoster y tipo.</div>';
  const keep=document.querySelector('main').scrollTop;$('#out').innerHTML=h;document.querySelector('main').scrollTop=keep;
  const n=L.filter(l=>l.sel).length;$('#cnt').textContent=n?n+' sel.':'';
  const d=groups.filter(g=>g.st!=='wait').length;$('#stat').textContent=groups.length?`${d}/${groups.length} páginas · ${L.length} enlaces`:'listo';
}
async function grab(g){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:g.url})});
    const j=await r.json();
    if(j.ok){g.st='ok';g.links=j.links.map(l=>({...l,h:hosterOf(l.host),t:typeOf(l.ext),sel:false}))}else{g.st='err';g.error=j.error||'fetch_failed'}
  }catch{g.st='err';g.error='net'}
  render();
}
async function run(){
  const us=urlsIn($('#inp').value);if(!us.length)return toast('No encontré URLs');
  groups=us.map(url=>({url,st:'wait',links:[]}));fh.clear();ft.clear();render();
  const q=[...groups];await Promise.all(Array.from({length:Math.min(4,q.length)},async()=>{while(q.length)await grab(q.shift())}));
}
$('#go').onclick=run;
$('#clear').onclick=()=>{$('#inp').value='';groups=[];fh.clear();ft.clear();render()};
$('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();$('#inp').value=($('#inp').value+'\n'+t).trim();toast('Pegado')}catch{$('#inp').focus();toast('Tu navegador no deja leer el portapapeles: pega a mano')}};
$('#out').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const s=c.dataset.k==='h'?fh:ft;s.has(c.dataset.v)?s.delete(c.dataset.v):s.add(c.dataset.v);render()});
$('#out').addEventListener('change',e=>{const i=e.target.dataset;if(i.g!=null){groups[i.g].links[i.i].sel=e.target.checked;const n=all().filter(l=>l.sel).length;$('#cnt').textContent=n?n+' sel.':''}});
$('#vis').onclick=()=>{all().forEach(l=>{if(vis(l))l.sel=true});render()};
$('#none').onclick=()=>{all().forEach(l=>l.sel=false);render()};
const picked=()=>all().filter(l=>l.sel).map(l=>l.href);
$('#copy').onclick=async()=>{const p=picked();if(!p.length)return toast('Selecciona enlaces primero');const t=p.join('\n');
  try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(p.length+' enlaces copiados')};
$('#dl').onclick=()=>{const p=picked();if(!p.length)return toast('Selecciona enlaces primero');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p.join('\n')],{type:'text/plain'}));a.download='webcatcher-'+new Date().toISOString().slice(0,10)+'.txt';a.click();URL.revokeObjectURL(a.href)};
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!navigator.permissions)return;
  try{const s=await navigator.permissions.query({name:'clipboard-read'});if(s.state!=='granted')return;
    const nu=urlsIn(await navigator.clipboard.readText()).filter(u=>!$('#inp').value.includes(u));if(nu.length){$('#inp').value=($('#inp').value+'\n'+nu.join('\n')).trim();toast(nu.length+' URL(s) detectadas en el portapapeles')}}catch{}});
</script></body></html>
